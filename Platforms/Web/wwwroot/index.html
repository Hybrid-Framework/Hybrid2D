<!DOCTYPE html>

<html>
    <head>
        <title>Web</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script type='module' src="./main.js"></script>
        <style>
            html, body {
                margin: 0;
                padding: 0;
                height: 100%;
                display: flex;
                justify-content: center;
                align-items: center;
                background-color: #ffffff;
            }
    
            #container {
                position: relative;
                display: inline-block;
            }
    
            #canvas {
                border-radius: 20px;
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
                background-color: #ffffff;
                display: block;
            }
    
            #playButton {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                font-size: 24px;
                padding: 12px 24px;
                border-radius: 12px;
                border: none;
                background-color: #007bff;
                color: white;
                cursor: pointer;
                z-index: 10;
                box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            }
        </style>
    </head>
    
    <body>
        <div id="container">
            <canvas id="canvas"></canvas>
            <button id="playButton">Play</button>
        </div>
    </body>
</html>
