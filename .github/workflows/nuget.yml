name: List Xcode Versions

on:
  workflow_dispatch:

jobs:
  list-xcodes:
    runs-on: macos-26

    steps:
      - name: List Xcode apps
        run: |
          echo "Installed Xcode versions:"
          ls -d /Applications/Xcode*.app || true

      - name: Show current Xcode selection
        run: |
          echo "Current Xcode:"
          xcode-select -p
          xcodebuild -version

      - name: Show version of each Xcode
        run: |
          for xcode in /Applications/Xcode*.app; do
            echo "-----------------------------------"
            echo "Xcode: $xcode"
            sudo xcode-select -s "$xcode"
            xcodebuild -version
          done
