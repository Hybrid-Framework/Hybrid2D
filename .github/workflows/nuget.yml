name: Build Nuget

on:
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: production

    steps:
      # 1️⃣ Check out the repository
      - name: Checkout repo
        uses: actions/checkout@v3

      # 2️⃣ Install .NET 10 SDK
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'

      # 3️⃣ Restore dependencies
      - name: Restore
        run: dotnet restore

      # 4️⃣ Build the project
      - name: Build
        run: dotnet build -c Release --no-restore

      # 5️⃣ Pack NuGet package
      - name: Pack
        run: dotnet pack Hybrid/Hybrid.csproj -c Release --no-build -o ./nupkg

      # 6️⃣ Publish to NuGet.org using Trusted Package Publishing
      - name: Publish
        run: |
          dotnet nuget push ./nupkg/*.nupkg \
            --api-key GitHub \
            --source https://api.nuget.org/v3/index.json
