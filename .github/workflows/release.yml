name: Build Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version'
        required: true
        default: '0.0.0'
      description:
        description: 'Description'
        required: true
        default: '0.0.0 Release'

permissions:
  contents: write
  id-token: write
  pages: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  nuget:
    name: Publish NuGet ${{ github.event.inputs.version }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build Packages
        run: |
          dotnet workload restore
          dotnet pack -c Release -p:PackageVersion=${{ github.event.inputs.version }}
          ls -l .nuget/

      - name: Publish Packages
        shell: bash
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          for pkg in .nuget/Hybrid2D*.nupkg; do
           echo "Pushing $pkg"
           dotnet nuget push "$pkg" --api-key $NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
          
  github:
    name: Publish Release ${{ github.event.inputs.version }}
    runs-on: windows-latest
    needs: nuget
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: recursive
  
      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.event.inputs.version }}
          name: ${{ github.event.inputs.version }}
          body: ${{ github.event.inputs.description }}
          draft: false
          prerelease: false
          skipIfReleaseExists: true

  website:
    name: Publish Website ${{ github.event.inputs.version }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: windows-latest
    needs: github
    env:
      HYBRID_VERSION: ${{ inputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Setup MKDocs
        run: |
          pip install mkdocs mkdocs-material

      - name: Setup Workloads
        run: |
          dotnet workload restore

      - name: Generate Documentation
        shell: bash
        run: |
          chmod +x .github/scripts/Website/Docs/Generate.sh
          ./.github/scripts/Website/Docs/Generate.sh

      - name: Generate Samples
        shell: bash
        run: |
          chmod +x .github/scripts/Website/Samples/Generate.sh
          ./.github/scripts/Website/Samples/Generate.sh

      - name: Build MKDocs
        run: mkdocs build

      - name: Upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
